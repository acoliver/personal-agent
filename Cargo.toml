[package]
name = "personal_agent"
version = "0.3.8"
edition = "2021"
license = "MIT"
description = "Personal agent with system tray UI (macOS menu bar / Linux KDE / Windows)"


[[bin]]
name = "personal_agent_gpui"
path = "src/main_gpui.rs"

[dependencies]
tray-icon = "0.21"
image = "0.25"
tracing = "0.1"
tracing-subscriber = "0.3"
# Note: core-foundation and core-graphics removed - we use objc2-core-foundation/objc2-core-graphics instead
# and removing these avoids version conflicts with GPUI
raw-window-handle = "0.6"
# Pin GPUI to same commit that ExactoBar uses (verified to build)
gpui = { git = "https://github.com/zed-industries/zed", rev = "c67328ab2e0d572718575e02ae07db37552e1cbe", package = "gpui", features = ["test-support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
dirs = "5"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Pin serdes-ai workspace crates to a single commit for reproducible local/CI builds.
#
# TEMPORARY FORK: the OpenAI Responses client (`serdes-ai-responses`) lives on
# acoliver/serdesAI#feature/issue-65-open-responses until upstream PR
# janfeddersen-wq/serdesAI#66 merges. Cargo resolves one source per package
# name, so every serdes-ai-* entry below has to point at the same repository and
# rev. When #66 lands, flip all of these back to
# https://github.com/janfeddersen-wq/serdesAI.git at the merged rev in one
# commit; nothing else in this crate needs to change.
serdes-ai = { git = "https://github.com/acoliver/serdesAI.git", rev = "bd6aefc96f699276afb6384257b101039a663b5f", package = "serdes-ai", features = ["openai", "anthropic", "mcp"] }
serdes-ai-agent = { git = "https://github.com/acoliver/serdesAI.git", rev = "bd6aefc96f699276afb6384257b101039a663b5f", package = "serdes-ai-agent" }
serdes-ai-tools = { git = "https://github.com/acoliver/serdesAI.git", rev = "bd6aefc96f699276afb6384257b101039a663b5f", package = "serdes-ai-tools" }
serdes-ai-mcp = { git = "https://github.com/acoliver/serdesAI.git", rev = "bd6aefc96f699276afb6384257b101039a663b5f", package = "serdes-ai-mcp", features = ["client", "reqwest"] }
serdes-ai-models = { git = "https://github.com/acoliver/serdesAI.git", rev = "bd6aefc96f699276afb6384257b101039a663b5f", package = "serdes-ai-models" }
serdes-ai-core = { git = "https://github.com/acoliver/serdesAI.git", rev = "bd6aefc96f699276afb6384257b101039a663b5f", package = "serdes-ai-core" }
# Responses protocol client (codex / Open Responses) over WebSocket, plus the
# PKCE OAuth flow used to authenticate against the ChatGPT backend.
serdes-ai-responses = { git = "https://github.com/acoliver/serdesAI.git", rev = "bd6aefc96f699276afb6384257b101039a663b5f", package = "serdes-ai-responses" }
serdes-ai-providers = { git = "https://github.com/acoliver/serdesAI.git", rev = "bd6aefc96f699276afb6384257b101039a663b5f", package = "serdes-ai-providers" }
urlencoding = "2.1"
tiny_http = "0.12"
once_cell = "1.19"
flume = "0.11"
rand = "0.9"
smol = "2"
# Issue 62: Markdown rendering
pulldown-cmark = "0.13"
url = "2"
bytes = "1"
regex = "1"
ignore = "0.4"
glob = "0.3"
rusqlite = { version = "0.33", features = ["bundled", "backup"] }
serde_yaml = "0.9"
tiktoken-rs = "0.9"
flate2 = "1"
aes-gcm = "0.10"
sha2 = "0.10"
rust-embed = "8"
base64 = "0.22"



[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSAlert",
    "NSAppearance",
    "NSApplication",
    "NSColor",
    "NSComboBox",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSPopover",
    "NSPopUpButton",
    "NSResponder",
    "NSRunningApplication",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSStepper",
    "NSSwitch",
    "NSTextField",
    "NSView",
    "NSViewController",
    "NSWindow",
    "NSStackView",
    "NSLayoutConstraint",
    "block2",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSError", "NSGeometry", "NSNotification", "NSString", "NSThread"] }
# Issue #177: SMAppService (macOS 13+) bindings for the Launch-at-Login toggle.
# Keep this under the macos-only dependency block so Linux/Windows builds do
# not pull AppKit into their compile graph.
objc2-service-management = { version = "0.3", features = ["SMAppService", "SMErrors", "block2", "objc2-foundation"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-graphics = "0.3"
# Pin core-text to 21.0.0 to avoid core-graphics version conflict (21.1.0 requires core-graphics 0.25 which conflicts)
core-text = "=21.0.0"
dispatch = "0.2"
keyring = { version = "3", features = ["apple-native"] }
cocoa = "0.26"
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.21"
muda = "0.17"

[target.'cfg(not(any(target_os = "macos", target_os = "linux")))'.dependencies]
keyring = "3"

[dev-dependencies]
tempfile = "3"
rstest = "0.18"
wiremock = "0.6"
# Raw websocket peer for the Responses wire tests: lets us assert the exact
# frames PersonalAgent puts on the socket without touching the network.
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
# Adds `test-util` on top of the feature set declared in [dependencies], enabling
# paused-clock tests (`#[tokio::test(start_paused = true)]`) so timeout behaviour can be
# verified without real waiting.
tokio = { version = "1.0", features = ["test-util"] }

[[test]]
name = "gui_main_thread"
harness = false

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cognitive_complexity = "warn"

# Disable incremental compilation for local dev/test to avoid large incremental artifact growth (Issue #23).
[profile.dev]
incremental = false

[profile.test]
incremental = false

# Linux packaging metadata for cargo-deb and cargo-generate-rpm
[package.metadata.deb]
maintainer = "Andrew C. Oliver <acoliver@apache.org>"
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/personal_agent_gpui", "usr/bin/personal-agent", "755"],
    ["assets/personal-agent.desktop", "usr/share/applications/personal-agent.desktop", "644"],
    ["assets/icon-16.png", "usr/share/icons/hicolor/16x16/apps/personal-agent.png", "644"],
    ["assets/icon-32.png", "usr/share/icons/hicolor/32x32/apps/personal-agent.png", "644"],
    ["assets/icon-64.png", "usr/share/icons/hicolor/64x64/apps/personal-agent.png", "644"],
    ["assets/AppIcon.iconset/icon_128x128.png", "usr/share/icons/hicolor/128x128/apps/personal-agent.png", "644"],
    ["assets/AppIcon.iconset/icon_256x256.png", "usr/share/icons/hicolor/256x256/apps/personal-agent.png", "644"],
    ["assets/AppIcon.iconset/icon_512x512.png", "usr/share/icons/hicolor/512x512/apps/personal-agent.png", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/personal_agent_gpui", dest = "/usr/bin/personal-agent", mode = "755" },
    { source = "assets/personal-agent.desktop", dest = "/usr/share/applications/personal-agent.desktop", mode = "644" },
    { source = "assets/icon-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/personal-agent.png", mode = "644" },
    { source = "assets/icon-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/personal-agent.png", mode = "644" },
    { source = "assets/icon-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/personal-agent.png", mode = "644" },
    { source = "assets/AppIcon.iconset/icon_128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/personal-agent.png", mode = "644" },
    { source = "assets/AppIcon.iconset/icon_256x256.png", dest = "/usr/share/icons/hicolor/256x256/apps/personal-agent.png", mode = "644" },
    { source = "assets/AppIcon.iconset/icon_512x512.png", dest = "/usr/share/icons/hicolor/512x512/apps/personal-agent.png", mode = "644" },
]

# Standalone workspace. The repo root Cargo.toml is a single-package implicit
# workspace with no members list, so this bare [workspace] table is required to
# stop cargo from claiming this package belongs to the parent workspace.
[workspace]

[package]
name = "localmodel-toy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "In-process llama.cpp agent loop proof-of-concept with Metal offload"
publish = false

[[bin]]
name = "localmodel-toy"
path = "src/main.rs"

[dependencies]
llama-cpp-2 = { version = "0.1.156", features = ["metal"] }
encoding_rs = "0.8"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[profile.release]
debug = false

# Bundled provider quirks manifest
#
# Each section defines per-provider overrides that eliminate the need for
# hardcoded if/match chains. Adding support for a new provider should
# only require a new entry here.
#
# Fields:
#   transport  - SerdesAI provider for serialization ("openai", "anthropic",
#                "groq", "mistral"). Optional; falls back to registry npm-based
#                detection, then provider_id name matching.
#   base_url   - API endpoint override. Optional; falls back to models.dev
#                registry lookup.
#   [<id>.headers] - Custom HTTP headers. Optional. A "User-Agent" key gets
#                    special handling via reqwest's USER_AGENT constant.
#
# User overrides: place a provider_quirks.toml in the app config directory
# (e.g. ~/Library/Application Support/PersonalAgent/provider_quirks.toml).
# User entries completely replace bundled entries for the same provider ID.
# To override a single field, copy the entire section from this file.

[anthropic]
base_url = "https://api.anthropic.com/v1"

[openai]
base_url = "https://api.openai.com/v1"

[zai]
transport = "openai"
base_url = "https://api.z.ai/api/paas/v4"

[zai-coding-plan]
transport = "openai"
base_url = "https://api.z.ai/api/coding/paas/v4"

[zhipuai]
transport = "openai"
base_url = "https://open.bigmodel.cn/api/paas/v4"

[zhipuai-coding-plan]
transport = "openai"
base_url = "https://open.bigmodel.cn/api/coding/paas/v4"

[kimi-for-coding]
transport = "openai"
base_url = "https://api.kimi.com/coding/v1"

[kimi-for-coding.headers]
User-Agent = "RooCode/1.0"

[openrouter]
transport = "openai"
base_url = "https://openrouter.ai/api/v1"

[synthetic]
transport = "openai"
base_url = "https://api.synthetic.new/v1"

[moonshotai]
transport = "openai"
base_url = "https://api.moonshot.ai/v1"

[moonshotai-cn]
transport = "openai"
base_url = "https://api.moonshot.cn/v1"

# ChatGPT / Codex. Authenticated with a ChatGPT subscription (OAuth), not an
# API key, and spoken over the Responses protocol on a websocket. The
# "open-responses" transport selects that client; the scheme of base_url picks
# websocket vs HTTP.
[openai-codex]
transport = "open-responses"
base_url = "wss://chatgpt.com/backend-api/codex/responses"

[openai-codex.headers]
OpenAI-Beta = "responses_websockets=2026-02-06"
originator = "personal-agent"

# Any Open Responses-compatible endpoint. The user supplies the URL and
# either an API key or an OAuth account.
[open-responses]
transport = "open-responses"
